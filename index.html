<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Blocos</title>
    <!-- conexão com o arquivo CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- conexão com o arquivo JavaScript -->
    <script src="script.js" defer></script>

</head>

<body>
    <main class="container">
        <section id="telaInicial">
            <h1>Desafio de Blocos</h1>

            <p>
                Prepare-se para o desafio! <br>
                Organize os blocos e complete linhas para ganhar pontos.
            </p>

            <button id="btnComecar">Começar</button>
        </section>
        <!-- Tela do jogo -->

        <selection id="telaJogo" hidden>
            <h2> Vamos Jogar!</h2>

            <p> Pontuação: <span id="pontuacao">0</span></p>

            <div id="tabuleiro"></div>
        </selection>

        <!-- Terceira tela: resultado -->
        <section id="telaResultado" hidden>
            <h1>Fim de jogo!</h1>

            <p>Mandou bem no desafio!</p>

            <p>
                Sua pontuação:
                <span id="pontuacaoFinal">0</span>
            </p>

            <button id="btnJogarNovamente">
                Jogar novamente
            </button>
        </section>

        <div class="controles-celular">
            <button id="btnEsquerda" aria-label="Mover para esquerda">←</button>
            <button id="btnGirar" aria-label="Girar peça">↻</button>
            <button id="btnDescer" aria-label="Acelerar descida">↓</button>
            <button id="btnDireita" aria-label="Mover para direita">→</button>
        </div>

    </main>


    <!-- conexão com o arquivo JavaScript -->
    <script src="script.js" defer></script>

</body>

</html>
